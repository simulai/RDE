name: tests

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest jsonschema

      - name: Run test suite
        run: pytest -vv -o addopts=

      - name: Replay demo (consistency check, acceptance #1)
        run: |
          python examples/replay_demo.py
          python examples/replay_demo.py --replay

      - name: Validate schemas parse (draft 2020-12)
        run: |
          python - <<'EOF'
          import json, pathlib
          from jsonschema import Draft202012Validator
          for p in sorted(pathlib.Path("schemas").glob("*.schema.json")):
              Draft202012Validator.check_schema(json.loads(p.read_text(encoding="utf-8")))
              print("OK", p)
          EOF
